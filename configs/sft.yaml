# Guide configuration from manual section 9.2.
model_name: Qwen/Qwen2.5-0.5B
train_path: data/processed/sft_train.jsonl   # 30,000 UltraChat single-turn examples
val_path: data/processed/sft_val.jsonl       # 1,000 examples
output_dir: outputs/sft

max_length: 512
per_device_batch_size: 2
gradient_accumulation_steps: 16   # effective batch 32
learning_rate: 2.0e-5
warmup_ratio: 0.03
scheduler: cosine
weight_decay: 0.1
max_grad_norm: 1.0
optimizer: adamw
epochs: 1
fp16: true                        # fp16 autocast, fp32 master weights, GradScaler

eval_every: 100                   # optimizer steps (~938 total)
eval_batch_size: 8
log_every: 10
seed: 42
device: cuda:0
gradient_checkpointing: false
